    <!-- Theme & Language Init (Mencegah Flash Screen/FOUC saat Dark Mode) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bsi-theme");
          var dark =
            t === "dark" ||
            (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);

          if (dark) {
            document.documentElement.classList.add("dark");
          }

          var m = document.querySelector('meta[name="theme-color"]');
          if (m) {
            m.setAttribute("content", dark ? "#0d1516" : "#00847D");
          }

          var l = localStorage.getItem("bsi-lang");
          if (l === "en") {
            document.documentElement.lang = "en";
          }
        } catch (e) {}
      })();
    </script>
